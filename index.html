<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- ============================ SEO METADATA ============================ -->
  <title>Connect with Solabot | Solabot Technologies Pvt. Ltd.</title>
  <meta name="description"
    content="Explore Solabot's official digital presence. Connect with Solabot Technologies Pvt. Ltd. across our website, YouTube, LinkedIn, Instagram, Facebook, X, WhatsApp and email." />
  <meta name="author" content="Solabot Technologies Pvt. Ltd." />
  <meta name="theme-color" content="#0aa3c2" />
  <meta name="robots" content="index, follow" />

  <!-- Open Graph (social sharing preview) -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Connect with Solabot" />
  <meta property="og:description" content="Explore our digital presence and stay connected." />
  <meta property="og:image" content="assets/solabot-logo-clean.png" />
  <meta property="og:site_name" content="Solabot Technologies Pvt. Ltd." />

  <!-- Twitter / X card -->
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Connect with Solabot" />
  <meta name="twitter:description" content="Explore our digital presence and stay connected." />
  <meta name="twitter:image" content="assets/solabot-logo-clean.png" />

  <!-- ============================== FAVICON ============================== -->
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="apple-touch-icon" href="assets/solabot-logo-clean.png" />

  <!-- ============================ FONTS & CSS ============================ -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <!-- Decorative animated background blobs -->
  <div class="bg-decor" aria-hidden="true">
    <span class="blob blob-1"></span>
    <span class="blob blob-2"></span>
    <span class="blob blob-3"></span>
  </div>

  <main class="page">
    <!-- ============================== HEADER ============================== -->
    <header class="hero">
      <div class="logo-wrap">
        <img
          src="assets/solabot-logo-clean.png"
          alt="Solabot Technologies Pvt. Ltd. logo"
          class="logo"
          width="200"
          height="200"
          decoding="async" />
      </div>
      <p class="tagline">Pioneer in Robotic Dry Cleaning of PV Modules</p>
      <h1 class="headline">Connect with Solabot</h1>
      <p class="subtext">Explore our digital presence and stay connected.</p>
    </header>

    <!-- ============================ SOCIAL CARDS =========================== -->
    <!--
      Cards are populated from the configuration in script.js.
      Each card's URL, label and availability are controlled there.
      Do not hard-code real URLs here — edit the SOLABOT_LINKS object in script.js.
    -->
    <section class="cards" id="cards" aria-label="Solabot official channels">
      <!-- Cards are injected by script.js -->
    </section>

    <!-- ============================== FOOTER ============================== -->
    <footer class="footer">
      <p>&copy; Solabot Technologies Pvt. Ltd. All rights reserved.</p>
    </footer>
  </main>

  <script src="script.js" defer></script>
</body>
</html>
